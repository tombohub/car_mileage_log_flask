version: "3"

tasks:
  dev:
    cmds:
      - uv run flask --app car_mileage_log_flask.app run --debug

  reload:
    cmds:
      - browser-sync 'http://127.0.0.1:5000' --files .

  gunicorn:
    cmds:
      - gunicorn car_mileage_log_flask.app:app

  dbmate:
    dotenv:
      - ./.env
    cmds:
      - dbmate {{.CLI_ARGS}}
  migrate-dev:
    dotenv:
      - ./.env
    cmds:
      - dbmate up

  # migrate-test:
  #   dotenv:
  #     - ./.env.test
  #   cmds:
  #     - dbmate --no-dump-schema up

  migrate-prod:
    dotenv:
      - ./.env.prod
    cmds:
      - dbmate --no-dump-schema up

  migrate:
    cmds:
      - task: migrate-dev
      # - task: migrate-test
      - task: migrate-prod
