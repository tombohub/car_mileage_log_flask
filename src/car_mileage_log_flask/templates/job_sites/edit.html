{% extends 'base.html' %}
{% from 'bootstrap5/form.html' import render_field %}

{% block content %}
<form action="{{ url_for('job_sites.edit', id=job_site.id) }}" method="post">
    {{ form.hidden_tag() }}

    {{ render_field(form.name) }}
    {{ render_field(form.address) }}

    <button type="submit" class="btn btn-primary w-100">
        Save changes
    </button>
</form>
{% endblock content %}
