<nav class="navbar">
    <div class="container-fluid">
        <a href="{{ url_for('home') }}" class="navbar-brand">Home</a>
        {% if session.get('logged_in') %}
        <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvas-navbar"
            aria-controls="offcanvas-navbar" aria-label="Open navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        {% endif %}
    </div>
</nav>

{% if session.get('logged_in') %}
<div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvas-navbar" aria-labelledby="offcanvas-navbar-title">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="offcanvas-navbar-title">Navigation</h5>
        <button class="btn-close" type="button" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>

    <div class="offcanvas-body p-0 h-100 d-flex flex-column">
        <!-- TOP -->
        <div class="list-group list-group-flush flex-grow-1">
            <a class="list-group-item list-group-item-action" href="{{ url_for('job_sites.index') }}">Job sites</a>
            <a class="list-group-item list-group-item-action" href="{{ url_for('drive_logs.index') }}">Drive logs</a>
            <a class="list-group-item list-group-item-action" href="{{ url_for('notes.index') }}">Notes</a>
        </div>

        <!-- BOTTOM -->
        <div class="list-group list-group-flush">
            <a href="{{ url_for('home') }}" class="list-group-item list-group-item-action">Home</a>
            <a href="{{ url_for('auth.logout') }}" class="list-group-item list-group-item-action">Logout</a>
        </div>
    </div>
</div>
{% endif %}
