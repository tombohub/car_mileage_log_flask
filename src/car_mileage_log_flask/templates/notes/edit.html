{% extends 'base.html' %}

{% block title %}Edit note{% endblock title %}

{% block content %}
<h1>Edit note</h1>
<form action="{{ url_for('notes.edit', id=note.id) }}" method="post">
    {% include 'notes/_form.html' %}
    <button type="submit" class="btn btn-primary w-100">Save changes</button>
</form>
<a href="{{ url_for('notes.index') }}" class="btn btn-secondary mt-3">Back</a>
{% endblock content %}
